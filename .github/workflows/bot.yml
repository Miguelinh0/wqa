name: Bot codigos
on:
  workflow_dispatch:
concurrency:
  group: bot
  cancel-in-progress: true
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      STREAM_URL: https://www.twitch.tv/rubius
      NTFY_TOPIC: codigos-62496d98
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install streamlink numpy imageio-ffmpeg rapidocr-onnxruntime requests
      - run: python -u bot.py "$STREAM_URL" --topic "$NTFY_TOPIC"
